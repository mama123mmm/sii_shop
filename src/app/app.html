<div class="page">
  <header class="site-header">
    <div class="brand">
      <span class="brand-icon">S</span>
      <span>si_shop</span>
    </div>
    <span class="header-subtitle">Znajdź samochód dla siebie</span>
  </header>

  <main class="main-content">
    <section class="search-section">
      <div class="section-heading">
        <p class="eyebrow">PORTAL MOTORYZACYJNY</p>
        <h1>Znajdź swój następny samochód</h1>
        <p class="description">
          Wybierz kryteria i znajdź samochód dopasowany do swoich potrzeb.
        </p>
      </div>

      <div class="search-card">
        <div class="form-grid">
          <div class="form-field">
            <label for="brand">Marka pojazdu</label>
            <select id="brand" (change)="onBrandChange($event)">
              <option value="">Wszystkie marki</option>
              @for (brand of brands; track brand) {
                <option [value]="brand">{{ brand }}</option>
              }
            </select>
          </div>

          <div class="form-field">
            <label for="model">Model pojazdu</label>
            <select
              id="model"
              [(ngModel)]="selectedModel"
              [disabled]="!selectedBrand"
            >
              <option value="">Wszystkie modele</option>
              @for (model of availableModels; track model) {
                <option [value]="model">{{ model }}</option>
              }
            </select>
          </div>

          <div class="form-field">
            <label for="priceFrom">Cena od (zł)</label>
            <input
              id="priceFrom"
              type="number"
              min="0"
              placeholder="Cena minimalna"
              [(ngModel)]="priceFrom"
            />
          </div>

          <div class="form-field">
            <label for="priceTo">Cena do (zł)</label>
            <input
              id="priceTo"
              type="number"
              min="0"
              placeholder="Cena maksymalna"
              [(ngModel)]="priceTo"
            />
          </div>

          <div class="form-field">
            <label for="yearFrom">Rok produkcji od</label>
            <input
              id="yearFrom"
              type="number"
              min="1900"
              [max]="currentYear"
              placeholder="Np. 2018"
              [(ngModel)]="yearFrom"
            />
          </div>

          <div class="form-field">
            <label for="yearTo">Rok produkcji do</label>
            <input
              id="yearTo"
              type="number"
              min="1900"
              [max]="currentYear"
              placeholder="Np. 2025"
              [(ngModel)]="yearTo"
            />
          </div>

          <div class="form-field full-width">
            <label for="fuel">Rodzaj paliwa</label>
            <select id="fuel" [(ngModel)]="selectedFuel">
              <option value="">Wszystkie rodzaje paliwa</option>
              @for (fuel of fuelTypes; track fuel.value) {
                <option [value]="fuel.value">{{ fuel.label }}</option>
              }
            </select>
          </div>
        </div>

        <button class="search-button" (click)="search()">
          <span class="search-icon">⌕</span>
          Szukaj samochodów
        </button>

        @if (searchMessage) {
          <p class="search-message" role="status">{{ searchMessage }}</p>
        }
      </div>

      <p class="page-note">
        Twoje miejsce do szukania samochodów.
      </p>
    </section>
  </main>
</div>
